name: Android release

# Builds the signed Android (arm64) release APK.
#  - push to main       -> next patch tag (highest vX.Y.Z + 1, none -> v0.3.0)
#                          is computed and a GitHub Release creates it.
#                          Skipped by "[skip release]" in the head commit
#                          message, or when only docs/.github files changed
#  - tag push v*        -> GitHub Release with APK + SHA-256
#  - workflow_dispatch  -> APK uploaded as a workflow artifact; if the "tag"
#                          input is set, also a GitHub Release (tag created
#                          at the built commit)

on:
  push:
    branches:
      - main
    # Evaluated in order, later patterns win; never applied to tag pushes.
    paths:
      - "**"
      - "!**.md"
      - "!.github/**"
      - ".github/workflows/android-release.yml"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.1.0. Empty = build only, no release"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

env:
  NDK_VERSION: 28.0.13004108
  # gradle/libs.versions.toml android-compileSdk = 37. Google's SDK repository
  # only has "platforms;android-37.0" (no "platforms;android-37"), which is the
  # package AGP looks for when compileSdk = 37.
  PLATFORM_PACKAGE: platforms;android-37.0
  BUILD_TOOLS_VERSION: 36.0.0
  NODE_VERSION: 24

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    if: >-
      github.ref_type == 'tag' ||
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, '[skip release]')
    permissions:
      contents: write
    env:
      KOMELIA_KEYSTORE_BASE64: ${{ secrets.KOMELIA_KEYSTORE_BASE64 }}
      KOMELIA_KEYSTORE_PASSWORD: ${{ secrets.KOMELIA_KEYSTORE_PASSWORD }}
      KOMELIA_KEY_ALIAS: ${{ secrets.KOMELIA_KEY_ALIAS }}
      KOMELIA_KEY_PASSWORD: ${{ secrets.KOMELIA_KEY_PASSWORD }}
    steps:
      - name: Validate release tag (manual run)
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if ! [[ "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+.*$ ]]; then
            echo "::error::Invalid tag '$INPUT_TAG'. It must look like v0.1.0 (^v[0-9]+\.[0-9]+\.[0-9]+.*\$)."
            exit 1
          fi
          if gh release view "$INPUT_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::A release for tag '$INPUT_TAG' already exists. Choose a new tag."
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$INPUT_TAG" > /dev/null 2>&1; then
            echo "::error::Git tag '$INPUT_TAG' already exists. Choose a new tag."
            exit 1
          fi

      - name: Check signing secrets
        run: |
          missing=""
          for name in KOMELIA_KEYSTORE_BASE64 KOMELIA_KEYSTORE_PASSWORD KOMELIA_KEY_ALIAS KOMELIA_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. See README section '포크 사용법'."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Sets RELEASE_TAG for later steps. Empty = build only (manual run
      # without tag). Runs for main are serialized by the concurrency group,
      # so two merges never compute the same tag.
      - name: Resolve release tag
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          tag=""
          prev=""
          if [ "$REF_TYPE" = tag ]; then
            tag="$REF_NAME"
          elif [ "$EVENT_NAME" = workflow_dispatch ]; then
            tag="$INPUT_TAG"
          elif [ "$EVENT_NAME" = push ]; then
            tags=$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" --jq '.[].ref | sub("^refs/tags/"; "")')
            tag=$(printf '%s\n' "$tags" | bash .github/scripts/next-tag.sh)
            prev=$(printf '%s\n' "$tags" | bash .github/scripts/next-tag.sh --latest)
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 \
              || gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" > /dev/null 2>&1; then
              echo "::error::Computed release tag '$tag' already exists (another run created it?). Re-run this workflow."
              exit 1
            fi
          fi
          echo "Release tag: ${tag:-<none, build only>} (previous: ${prev:-<none>})"
          {
            echo "RELEASE_TAG=$tag"
            echo "PREV_TAG=$prev"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK components
        run: |
          set -eu
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          # the runner image's cmdline-tools can be old; update before installing
          "$SDKMANAGER" --install "cmdline-tools;latest" > /dev/null
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install \
            "${PLATFORM_PACKAGE}" \
            "build-tools;${BUILD_TOOLS_VERSION}" \
            "ndk;${NDK_VERSION}" > /dev/null
          "$SDKMANAGER" --list_installed | grep -E "android-37|build-tools;|ndk;"
          test -d "$SDK/platforms/android-37.0"
          {
            echo "ANDROID_SDK_PATH=$SDK"
            echo "ANDROID_NDK_PATH=$SDK/ndk/${NDK_VERSION}"
            echo "BUILD_TOOLS_DIR=$SDK/build-tools/${BUILD_TOOLS_VERSION}"
          } >> "$GITHUB_ENV"

      # Same method as upstream: the README "Android App" section builds the
      # native libraries inside cmake/android.Dockerfile (ubuntu 25.10, apt
      # meson/cmake/ninja/nasm/..., NDK 28.0.13004108). Host ubuntu-24.04 tools
      # (cmake/meson versions, preinstalled /usr/local binaries) differ, so run
      # the upstream image instead of installing tools on the host.
      - name: Build native build image
        run: docker build -t komelia-build-android . -f ./cmake/android.Dockerfile

      # Run as the runner's uid so build output in the workspace stays writable
      # without chown/chmod. Full output is kept in native-build.log because
      # parallel ninja output can bury the first real error.
      - name: Build native libraries (aarch64)
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/build" komelia-build-android aarch64 2>&1 | tee "$RUNNER_TEMP/native-build.log"

      - name: Show first native build error
        if: failure()
        run: |
          grep -n -m 20 -E "FAILED:|error:|Error [0-9]+|CMake Error|fatal error|undefined reference|No such file" "$RUNNER_TEMP/native-build.log" || true

      - name: Upload native build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-build-log
          path: ${{ runner.temp }}/native-build.log
          if-no-files-found: ignore

      - name: Copy native libraries and build epub readers
        run: ./gradlew android-aarch64_copyJniLibs buildEpubReaders --no-daemon

      - name: Assemble release APK (unsigned)
        run: |
          set -eu
          version_args=""
          if [ -n "$RELEASE_TAG" ]; then
            if ! [[ "$RELEASE_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
              echo "::error::Tag '$RELEASE_TAG' must look like v1.2.3"
              exit 1
            fi
            major=$((10#${BASH_REMATCH[1]})); minor=$((10#${BASH_REMATCH[2]})); patch=$((10#${BASH_REMATCH[3]}))
            if [ "$minor" -ge 100 ] || [ "$patch" -ge 100 ]; then
              echo "::error::minor and patch must be below 100 (versionCode = MAJOR*10000 + MINOR*100 + PATCH)"
              exit 1
            fi
            version_code=$((major * 10000 + minor * 100 + patch))
            if [ "$version_code" -le 25 ]; then
              echo "::error::versionCode $version_code must be higher than the previously shipped 25"
              exit 1
            fi
            version_args="-Pkomelia.versionName=${RELEASE_TAG#v} -Pkomelia.versionCode=$version_code"
            echo "versionName=${RELEASE_TAG#v} versionCode=$version_code"
          fi
          ./gradlew :androidRelease --no-daemon $version_args

      - name: Sign APK
        run: |
          set -eu
          unsigned=$(ls komelia-app/androidApp/build/outputs/apk/release/*.apk | head -n 1)
          test -f "$unsigned"
          ks="$RUNNER_TEMP/komelia.jks"
          printf '%s' "$KOMELIA_KEYSTORE_BASE64" | base64 -d > "$ks"
          mkdir -p dist
          aligned="$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS_DIR/zipalign" -f -p 4 "$unsigned" "$aligned"
          if [ -n "$RELEASE_TAG" ]; then
            name="komelia-${RELEASE_TAG}-arm64.apk"
          else
            name="komelia-${GITHUB_REF_NAME//\//-}-arm64.apk"
          fi
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks "$ks" \
            --ks-key-alias "$KOMELIA_KEY_ALIAS" \
            --ks-pass env:KOMELIA_KEYSTORE_PASSWORD \
            --key-pass env:KOMELIA_KEY_PASSWORD \
            --out "dist/$name" "$aligned"
          "$BUILD_TOOLS_DIR/apksigner" verify "dist/$name"
          rm -f "$ks"
          (cd dist && sha256sum "$name" > "$name.sha256" && cat "$name.sha256")

      - name: Upload artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: komelia-apk
          path: dist/*
          if-no-files-found: error

      - name: Create GitHub Release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # Last check right before creating: the release creates the tag.
          if [ "$GITHUB_REF_TYPE" != tag ] && git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" > /dev/null 2>&1; then
            echo "::error::Tag '$RELEASE_TAG' already exists; refusing to create the release."
            exit 1
          fi
          sha=$(cat dist/*.sha256)
          notes_args=""
          if [ -n "${PREV_TAG:-}" ]; then
            notes_args="--notes-start-tag $PREV_TAG"
          fi
          # shellcheck disable=SC2086
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes $notes_args \
            --notes "Android arm64 APK (signed). SHA-256:

          \`\`\`
          $sha
          \`\`\`"
